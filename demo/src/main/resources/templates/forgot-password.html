<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Energo-Pro Auction - პაროლის აღდგენა</title>
    <link rel="stylesheet" href="/styles/css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta charset="utf-8">
    <style>
        nav.top-nav { background: #003399; padding: 8px 20px; display: flex; gap: 20px; }
        nav.top-nav a { color: #fff; text-decoration: none; font-size: 14px; }
        nav.top-nav a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div id="fragment"></div>

<nav class="top-nav">
    <a href="/">მთავარი</a>
    <a href="/login">შესვლა</a>
</nav>

<header>
    <img src="/styles/img/header1.svg" alt="" id="header_fragment">
    <div class="header-body">
        <div class="row">
            <div class="page-name">
                <div class="small"><a href="">აუქციონები.</a></div>
            </div>
            <div id="logo">
                <a href="/login"><img src="/styles/img/logo.svg" alt=""></a>
            </div>
            <div class="nav"></div>
        </div>
    </div>
</header>

<main>
    <div class="login error reg-ok">
        <div class="header bold">პაროლის აღდგენა</div>
        <div class="body">
            <p class="big">პაროლის აღსადგენად გთხოვთ შეიტანოთ ელ.ფოსტის მისამართი,
                რომლითაც ხართ რეგისტრირებული აუქციონების პლათფორმაზე.</p>
            <form role="form" action="/forgot-password" method="POST" class="login-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="email" required placeholder="ელ.ფოსტა" name="email">
                <span id="errorExsist" class="error">ელ.ფოსტა არასწორია</span>
                <input type="submit" class="login-submit" value="ახალი პაროლის გაგზავნა">
            </form>
        </div>
    </div>
</main>

<footer>
    <div class="copyright bold">© ენერგო-პრო საქართველო.</div>
    <div class="call"></div>
    <img src="/styles/img/footer1.svg" alt="" id="footer_fragment">
    <a href="/"><img id="footer-logo" src="/styles/img/footer-logo.svg"></a>
</footer>

<script src="/styles/js/jquery.min.js"></script>
<script src="/styles/js/main.js"></script>
</body>
</html>
