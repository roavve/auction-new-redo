<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="pragma" content="no-cache"/>
    <meta http-equiv="cache-control" content="no-cache"/>
    <title>Energo-Pro</title>
    <link rel="stylesheet" href="/styles/css/style.css">
    <style>
        .company-subnav {
            display: flex;
            gap: 0;
            margin: 24px 32px;
            border-bottom: 2px solid #e0eef5;
            flex-wrap: wrap;
        }
        .company-subnav a {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #444;
            text-decoration: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: color 0.15s, border-color 0.15s;
        }
        .company-subnav a:hover,
        .company-subnav a.active {
            color: #008DD0;
            border-bottom-color: #008DD0;
        }
        .company-subnav .divider {
            width: 1px;
            background: #e0eef5;
            margin: 6px 0;
        }
        .files-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }
        .files-table thead tr { background: #008DD0; color: #fff; }
        .files-table th { padding: 10px 14px; text-align: left; font-weight: 600; }
        .files-table tbody tr { border-bottom: 1px solid #e0eef5; }
        .files-table tbody tr:hover { background: #f0f8ff; }
        .files-table td { padding: 10px 14px; vertical-align: middle; }
        .files-table td a { color: #008DD0; text-decoration: none; }
        .files-table td a:hover { text-decoration: underline; }
        .empty-state {
            text-align: center; padding: 32px; color: #999; font-style: italic;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<header>
    <img src="/styles/img/header1.svg" alt="" id="header_fragment">
    <div class="header-body">
        <div class="row">
            <div class="page-name">
                <div class="small"><a href="/">ფასთა გამოკითხვა</a></div>
                <div class="big">კომპანიის ინფორმაცია</div>
            </div>
            <div id="logo">
                <a href="/"><img src="/styles/img/logo.svg" alt=""></a>
            </div>
        </div>
    </div>
</header>

<main>
    <nav class="company-subnav">
        <a th:href="@{/user/change_password}">🔒 პაროლის ცვლილება</a>
        <div class="divider"></div>
        <a th:href="@{/company/view_company_users}">👤 მომხმარებლები</a>
        <div class="divider"></div>
        <a th:href="@{/company/view_company}">ℹ კომპანიის ინფორმაცია</a>
        <div class="divider"></div>
        <a th:href="@{/company/view_company_files}" class="active">📄 კომპანიის ფაილები</a>
    </nav>

    <div class="reg-header">
        <div class="heading bold">კომპანიის ფაილები</div>
    </div>

    <div class="reg-body-1">
        <div th:if="${companyFiles != null and !companyFiles.isEmpty()}">
            <table class="files-table">
                <thead>
                <tr>
                    <th>ფაილის დასახელება</th>
                    <th>აღწერა</th>
                    <th>მომხმარებელი</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ch : ${companyFiles}">
                    <td>
                        <a th:href="@{/company/download_company_file(attachmentKey=${ch.recordKey})}"
                           th:text="${ch.fileName}">ფაილი</a>
                    </td>
                    <td th:text="${ch.fileDescription}">-</td>
                    <td th:text="${ch.fileUser}">-</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${companyFiles == null or companyFiles.isEmpty()}" class="empty-state">
            ფაილები არ მოიძებნა.
        </div>
    </div>
</main>

<footer>
    <div class="copyright bold">© ენერგო-პრო საქართველო.</div>
    <img src="/styles/img/footer1.svg" alt="" id="footer_fragment">
    <a href="/"><img id="footer-logo" src="/styles/img/footer-logo.svg"></a>
</footer>

<script src="/styles/js/jquery-2.1.1.js"></script>
<script src="/styles/js/main.js"></script>
</body>
</html>
