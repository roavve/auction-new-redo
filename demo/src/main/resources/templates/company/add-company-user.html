<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="pragma" content="no-cache"/>
    <meta http-equiv="cache-control" content="no-cache"/>
    <title>Energo-Pro Auction</title>
    <link rel="stylesheet" href="/styles/css/style.css">
    <style>
        .form-card {
            background: #fff;
            border: 1px solid #d0e6f3;
            border-radius: 8px;
            padding: 32px;
            max-width: 560px;
            margin: 0 auto;
        }
        .form-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e0eef5;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: #444;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #008DD0;
            box-shadow: 0 0 0 2px rgba(0,141,208,0.15);
        }
        .error-msg {
            color: red;
            display: none;
            font-size: 1rem;
            margin-bottom: 12px;
        }
        .btn-submit {
            background: #008DD0;
            color: #fff;
            padding: 10px 28px;
            border: none;
            border-radius: 5px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-submit:hover { background: #006fa0; }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<header>
    <img src="/styles/img/header1.svg" alt="" id="header_fragment">
    <div class="header-body">
        <div class="row">
            <div class="page-name">
                <div class="small"><a href="/">ფასთა გამოკითხვა</a></div>
                <div class="big">კომპანიის მომხმარებლის დამატება</div>
            </div>
            <div id="logo">
                <a href="/"><img src="/styles/img/logo.svg" alt=""></a>
            </div>
        </div>
    </div>
</header>

<main>
    <div class="reg-header">
        <div class="heading bold">კომპანიის მომხმარებლის დამატება</div>
    </div>

    <div class="reg-body-1">
        <div class="form-card">
            <div class="form-title">✦ ახალი მომხმარებლის დამატება</div>

            <div id="errorExsist" class="error-msg"
                 th:classappend="${errors != null and errors != ''} ? 'displayed' : ''"
                 th:style="${errors != null and errors != ''} ? 'display:block' : 'display:none'">
                ასეთი მომხმარებელი უკვე არსებობს!
            </div>

            <form th:action="@{/company/save_company_user}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" id="exError" th:value="${errors}"/>

                <div class="form-group">
                    <label>სახელი</label>
                    <input type="text" name="firstName" placeholder="შეიყვანეთ სახელი" required>
                </div>

                <div class="form-group">
                    <label>გვარი</label>
                    <input type="text" name="lastName" placeholder="შეიყვანეთ გვარი" required>
                </div>

                <div class="form-group">
                    <label>იმეილი</label>
                    <input type="email" name="userName" placeholder="შეიყვანეთ იმეილი" required>
                </div>

                <div class="form-group">
                    <label>პაროლი</label>
                    <input type="password" name="pass" placeholder="შეიყვანეთ პაროლი" required>
                </div>

                <div class="form-group">
                    <label>საკონტაქტო პირის პოზიცია</label>
                    <input type="text" name="contactPosition" placeholder="შეიყვანეთ პოზიცია" required>
                </div>

                <div class="form-group">
                    <label>საკონტაქტო პირის იმეილი</label>
                    <input type="email" name="contactEmail" placeholder="შეიყვანეთ საკონტაქტო იმეილი" required>
                </div>

                <div class="form-group">
                    <label>საკონტაქტო პირის ტელეფონი</label>
                    <input type="text" name="contactPhone" placeholder="შეიყვანეთ ტელეფონი" required>
                </div>

                <div class="form-group">
                    <label>საკონტაქტო პირის მობილური</label>
                    <input type="text" name="contactMobile" placeholder="შეიყვანეთ მობილური" required>
                </div>

                <div>
                    <button type="submit" class="btn-submit">შენახვა</button>
                </div>
            </form>
        </div>
    </div>
</main>

<footer>
    <div class="copyright bold">© ენერგო-პრო საქართველო.</div>
    <img src="/styles/img/footer1.svg" alt="" id="footer_fragment">
    <a href="/"><img id="footer-logo" src="/styles/img/footer-logo.svg"></a>
</footer>

<script src="/styles/js/jquery-2.1.1.js"></script>
<script src="/styles/js/main.js"></script>
</body>
</html>
