<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="navbar" class="site-nav">
    <div class="nav-inner">
        <div class="nav-left">
            <a th:href="@{/}" class="nav-logo">
                <img src="/styles/img/logo.svg" alt="Energo-Pro">
            </a>
        </div>

        <div class="nav-right" style="display: flex; gap: 20px; align-items: center;">

            <!-- ONLY shows if a user is logged in -->
            <div sec:authorize="isAuthenticated()" style="display: flex; gap: 20px; align-items: center;">
                <div class="nav-user">
                    <!-- Automatically prints the logged-in email -->
                    <span sec:authentication="name">მომხმარებელი</span>
                </div>

                <form th:action="@{/logout}" method="post" style="margin: 0;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" style="background: none; border: none; color: white; font-weight: bold; cursor: pointer; padding: 0;">
                        გასვლა (Log Out)
                    </button>
                </form>
            </div>

            <!-- ONLY shows if no one is logged in -->
            <div sec:authorize="isAnonymous()">
                <a href="/login" style="color: white; font-weight: bold; text-decoration: none;">
                    ავტორიზაცია (Log In)
                </a>
            </div>

        </div>
    </div>
</nav>

</body>
</html>
